{% extends "base.html" %}{% block content %}<h1>إضافة أو صرف</h1><section class="panel narrow"><form method="post"><label>الصنف<select name="part_id" required>{% for p in parts %}<option value="{{p.id}}">{{p.code}} — {{p.name}}</option>{% endfor %}</select></label><label>المخزن<select name="warehouse_id">{% for w in warehouses %}<option value="{{w.id}}">{{w.name}}</option>{% endfor %}</select></label><label>نوع الحركة<select name="movement_type"><option>إضافة</option><option>صرف</option></select></label><label>الكمية<input name="quantity" type="number" min="1" required></label><label>ملاحظات<input name="note"></label><button>تسجيل الحركة</button></form></section>{% endblock %}
