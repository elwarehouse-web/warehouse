{% extends "base.html" %}{% block content %}<h1>إدارة المستخدمين</h1><section class="panel narrow"><h2>إضافة مستخدم</h2><form method="post"><label>اسم المستخدم<input name="username" required></label><label>كلمة المرور (10 أحرف على الأقل)<input name="password" type="password" minlength="10" required></label><label>الصلاحية<select name="role"><option value="staff">موظف</option><option value="admin">مدير</option></select></label><button>إضافة المستخدم</button></form></section><section class="panel"><table><tr><th>اسم المستخدم</th><th>الصلاحية</th><th>الحالة</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{"مدير" if u.role=="admin" else "موظف"}}</td><td>{{"نشط" if u.active else "موقوف"}}</td></tr>{% endfor %}</table></section>{% endblock %}
