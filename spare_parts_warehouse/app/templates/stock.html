{% extends "base.html" %}{% block content %}<h1>أرصدة المخازن</h1><section class="panel"><table><tr><th>كود الصنف</th><th>القطعة</th><th>المخزن</th><th>الرصيد</th><th>الوحدة</th><th>الحد الأدنى</th></tr>{% for p,s,w in rows %}<tr><td>{{p.code}}</td><td>{{p.name}}</td><td>{{w.name}}</td><td><b>{{s.quantity}}</b></td><td>{{p.unit}}</td><td>{{p.min_stock}}</td></tr>{% else %}<tr><td colspan="6">لا توجد بيانات</td></tr>{% endfor %}</table></section>{% endblock %}
