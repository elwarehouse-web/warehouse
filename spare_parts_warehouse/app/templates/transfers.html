{% extends "base.html" %}{% block content %}<h1>تحويل بين المخازن</h1><section class="panel narrow"><form method="post"><label>الصنف<select name="part_id">{% for p in parts %}<option value="{{p.id}}">{{p.code}} — {{p.name}}</option>{% endfor %}</select></label><label>من مخزن<select name="from_id">{% for w in warehouses %}<option value="{{w.id}}">{{w.name}}</option>{% endfor %}</select></label><label>إلى مخزن<select name="to_id">{% for w in warehouses %}<option value="{{w.id}}">{{w.name}}</option>{% endfor %}</select></label><label>الكمية<input name="quantity" type="number" min="1" required></label><label>ملاحظات<input name="note"></label><button>تنفيذ التحويل</button></form></section>{% endblock %}
