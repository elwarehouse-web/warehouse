{% extends "base.html" %}{% block content %}<h1>تقرير النواقص</h1><section class="panel"><p>الأصناف التي وصل رصيدها إلى حد إعادة الطلب أو أقل.</p><table><tr><th>الكود</th><th>الصنف</th><th>المخزن</th><th>الرصيد</th><th>الحد الأدنى</th></tr>{% for p,s,w in rows %}<tr><td>{{p.code}}</td><td>{{p.name}}</td><td>{{w.name}}</td><td class="danger">{{s.quantity}}</td><td>{{p.min_stock}}</td></tr>{% else %}<tr><td colspan="5">لا توجد نواقص حالياً</td></tr>{% endfor %}</table></section>{% endblock %}
